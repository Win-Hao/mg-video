<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mg-video · fifteen styles</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
  header { max-width: 1200px; margin: 0 auto; padding: 32px 20px 8px; }
  h1 { margin: 0 0 4px; font-size: 28px; color: #fff; }
  header p { margin: 0; color: #999; }
  a { color: #8cf; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  figure { margin: 0; }
  video { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; border-radius: 6px; }
  figcaption { margin-top: 8px; }
  code { color: #fff; font-weight: 600; }
  figcaption span { display: block; color: #999; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>mg-video</h1>
  <p>One finished 10-second film per style card, with sound. Made with <a href="https://github.com/Win-Hao/mg-video">mg-video</a>.</p>
</header>
<main>
<figure id="01-paperclip-sticker"><video src="films/01-paperclip-sticker.mp4" poster="films/01-paperclip-sticker.gif" controls preload="none" playsinline></video><figcaption><code>01-paperclip-sticker</code><span>white-bordered object stickers, one big table and one camera, true charts</span></figcaption></figure>
<figure id="02-flat-vector"><video src="films/02-flat-vector.mp4" poster="films/02-flat-vector.gif" controls preload="none" playsinline></video><figcaption><code>02-flat-vector</code><span>flat geometry, elastic entrances, one lead at a time</span></figcaption></figure>
<figure id="03-isometric"><video src="films/03-isometric.mp4" poster="films/03-isometric.gif" controls preload="none" playsinline></video><figcaption><code>03-isometric</code><span>true 30° isometric, depth-sorted objects, pipes between components</span></figcaption></figure>
<figure id="04-hud"><video src="films/04-hud.mp4" poster="films/04-hud.gif" controls preload="none" playsinline></video><figcaption><code>04-hud</code><span>two hues, wireframes, scans, locks</span></figcaption></figure>
<figure id="05-glassmorphism"><video src="films/05-glassmorphism.mp4" poster="films/05-glassmorphism.gif" controls preload="none" playsinline></video><figcaption><code>05-glassmorphism</code><span>frosted cards over drifting colour light</span></figcaption></figure>
<figure id="06-bauhaus"><video src="films/06-bauhaus.mp4" poster="films/06-bauhaus.gif" controls preload="none" playsinline></video><figcaption><code>06-bauhaus</code><span>grid, primaries plus black, one action per beat</span></figcaption></figure>
<figure id="07-variety-captions"><video src="films/07-variety-captions.mp4" poster="films/07-variety-captions.gif" controls preload="none" playsinline></video><figcaption><code>07-variety-captions</code><span>multi-outline chubby text, pops, emotion symbols</span></figcaption></figure>
<figure id="08-pixel"><video src="films/08-pixel.mp4" poster="films/08-pixel.gif" controls preload="none" playsinline></video><figcaption><code>08-pixel</code><span>small canvas scaled up, limited palette, frame-by-frame sprites</span></figcaption></figure>
<figure id="09-cel-boil"><video src="films/09-cel-boil.mp4" poster="films/09-cel-boil.gif" controls preload="none" playsinline></video><figcaption><code>09-cel-boil</code><span>lines that tremble every few frames, 12 drawings/s, hand-drawn effects</span></figcaption></figure>
<figure id="10-one-line"><video src="films/10-one-line.mp4" poster="films/10-one-line.gif" controls preload="none" playsinline></video><figcaption><code>10-one-line</code><span>a single line drawn throughout, the line becomes fill</span></figcaption></figure>
<figure id="11-morph"><video src="films/11-morph.mp4" poster="films/11-morph.gif" controls preload="none" playsinline></video><figcaption><code>11-morph</code><span>one outline continuously becoming another</span></figcaption></figure>
<figure id="12-collage"><video src="films/12-collage.mp4" poster="films/12-collage.gif" controls preload="none" playsinline></video><figcaption><code>12-collage</code><span>scissor-cut edges, halftone, jerky motion</span></figcaption></figure>
<figure id="13-liquid"><video src="films/13-liquid.mp4" poster="films/13-liquid.gif" controls preload="none" playsinline></video><figcaption><code>13-liquid</code><span>blobs that merge and split</span></figcaption></figure>
<figure id="14-synthwave"><video src="films/14-synthwave.mp4" poster="films/14-synthwave.gif" controls preload="none" playsinline></video><figcaption><code>14-synthwave</code><span>striped sunset, neon grid, chrome type, tape</span></figcaption></figure>
<figure id="15-3d-material"><video src="films/15-3d-material.mp4" poster="films/15-3d-material.gif" controls preload="none" playsinline></video><figcaption><code>15-3d-material</code><span>real materials, soft light, shallow focus (Blender + Cycles)</span></figcaption></figure>
</main>
</body>
</html>
